[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appstore-snapshots"
version = "0.1.0"
description = "Upload App Store screenshots from per-device folders to App Store Connect."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Rouzbeh Abadi", email = "rouzbeh.abadi@me.com" }]
keywords = ["appstore", "app-store-connect", "screenshots", "snapshots", "ios", "fastlane"]

dependencies = [
    "streamlit>=1.33",
    "requests>=2.31",
    "pyjwt[crypto]>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
appstore-snapshots = "appstore_snapshots.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/appstore_snapshots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
